; AI ลูกเทพ / Hermes Voice Box - ESP-IDF firmware for SpotPear ESP32-AI-1.54 V2.0 (ESP32-S3 N16R8)
[platformio]
src_dir = main

[env:usb]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.arduino.memory_type = qio_opi
extra_scripts = pre:tools/version_stamp.py
upload_protocol = esptool
upload_port = /dev/cu.usbmodem2101
monitor_port = /dev/cu.usbmodem2101
monitor_speed = 115200

; deliberately broken image used to prove rollback works: pio run -e broken
[env:broken]
extends = env:usb
build_flags = -DOTA_TEST_BREAK=1
