; aiBot test firmware for SpotPear ESP32-S3 1.54 (sp-esp32-s3-1.54-muma)
[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
board_upload.offset_address = 0x20000
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
lib_deps =
    lovyan03/LovyanGFX@^1.2.0

; first flash over USB cable
[env:usb]
upload_protocol = esptool
upload_port = /dev/cu.usbmodem2101
monitor_port = /dev/cu.usbmodem2101

; later updates over Wi-Fi (OTA): pio run -e ota -t upload
[env:ota]
upload_protocol = espota
upload_port = ai-luk-thep.local
upload_flags =
    --auth=${sysenv.OTA_PASSWORD}
